<article class="tarjeta hallazgo" id="{{id}}">
  <div class="h-cabeza">
    <span class="h-num {{clase_num}}">{{numero}}</span>
    <div>
      <h3>{{titulo}}</h3>
      <p>{{lede}}</p>
    </div>
  </div>
  <div class="h-cuerpo">
    {{nota_denominador}}
    {{grafico}}
    {{tabla}}
  </div>
  <p class="h-nota"><b>Qué no dice.</b> {{no_dice}}</p>
</article>
