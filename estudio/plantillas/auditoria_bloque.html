<article class="tarjeta bloque">
  <div class="bloque-cabeza">
    <span class="paso">{{paso}}</span>
    <div>
      <h3>{{nombre}} · <span>{{subtitulo}}</span></h3>
      <p>{{descripcion}}</p>
    </div>
    <div class="der">
      <div class="pn">{{percentil}}</div>
      <div class="pl">percentil</div>
      <div class="ps">{{puntaje_texto}}</div>
    </div>
  </div>
  <div class="bloque-cuerpo">
    <div class="grafico">
      {{grafico}}
      {{pie_grafico}}
      <div class="distancia">{{distancia}}</div>
    </div>
    <div class="tabla">{{tabla}}</div>
  </div>
  <div class="mecanismo"><b>Qué mueve este bloque.</b> {{mecanismo}}</div>
</article>
